<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyen Labs - Workspace</title>
  <style>
    /* --- Core Windows 95 Design Tokens --- */
    :root {
      --desktop-bg: #008080; /* Classic Teal */
      --win-bg: #c0c0c0;     /* Light Grey */
      --win-edge-light: #fff;
      --win-edge-shadow: #808080;
      --win-edge-dark: #0a0a0a;
      --title-blue: #000080;
      --title-text: #ffffff;
      --font-stack: "MS Sans Serif", Tahoma, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--desktop-bg);
      font-family: var(--font-stack);
      font-size: 14px;
      color: var(--win-edge-dark);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* --- Retro Bevel Borders --- */
    .outset-border {
      border: 2px solid;
      border-color: var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
    }

    .inset-border {
      border: 2px solid;
      border-color: var(--win-edge-shadow) var(--win-edge-light) var(--win-edge-light) var(--win-edge-shadow);
      background-color: #fff;
    }

    /* --- Desktop Header & Icon Grid --- */
    header {
      color: white;
      text-shadow: 1px 1px var(--win-edge-dark);
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .desktop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 20px;
      max-width: 600px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: white;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }

    /* CSS-only generic retro app icons */
    .icon-box {
      width: 32px;
      height: 32px;
      background: #000080;
      margin-bottom: 6px;
      position: relative;
      box-shadow: 2px 2px 0px #000;
    }
    .icon-box::before {
      content: "💻";
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 20px;
    }

    .desktop-icon span {
      padding: 2px 4px;
      background: transparent;
      text-shadow: 1px 1px 1px #000;
    }

    .desktop-icon:focus span {
      background: var(--title-blue);
      outline: 1px dotted #fff;
    }

    /* --- Workspace Window Layout Layout --- */
    main {
      display: flex;
      flex-direction: column;
      gap: 32px; /* Increased gap to give it a distinct "desktop spacing" feel */
      width: 100%;
      margin-top: 16px; /* Pushes the first window away from the icon grid */
      margin-bottom: 32px; /* Adds space before hitting the bottom taskbar */
    }

    /* --- Responsive App Window System --- */
    .window {
      background-color: var(--win-bg);
      padding: 3px;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    .title-bar {
      background: linear-gradient(90deg, var(--title-blue), #1084d0);
      color: var(--title-text);
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .title-bar-controls button {
      width: 16px;
      height: 14px;
      font-size: 9px;
      font-weight: bold;
      vertical-align: middle;
      background-color: var(--win-bg);
      border: 1px solid;
      border-color: var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
      cursor: pointer;
    }

    .window-body {
      padding: 16px;
    }

    .window-inset {
      padding: 16px;
      min-height: 100px;
      line-height: 1.5;
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
