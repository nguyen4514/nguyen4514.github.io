<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyen Labs - Technical Support</title>
  <style>
    /* --- Core Windows 95 Design Tokens --- */
    :root {
      --desktop-bg: #008080; /* Classic Teal */
      --win-bg: #c0c0c0;     /* Light Grey */
      --win-edge-light: #fff;
      --win-edge-shadow: #808080;
      --win-edge-dark: #0a0a0a;
      --title-blue: #000080;
      --title-text: #ffffff;
      --font-stack: "MS Sans Serif", Tahoma, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--desktop-bg);
      font-family: var(--font-stack);
      font-size: 14px;
      color: var(--win-edge-dark);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Retro Bevel Borders --- */
    .outset-border {
      border: 2px solid;
      border-color: var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
    }

    .inset-border {
      border: 2px solid;
      border-color: var(--win-edge-shadow) var(--win-edge-light) var(--win-edge-light) var(--win-edge-shadow);
      background-color: #fff;
    }

    /* --- Workspace Layout Container --- */
    main {
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-top: 24px;
      margin-bottom: 60px; /* Space for fixed taskbar */
    }

    /* --- Responsive App Window System --- */
    .window {
      background-color: var(--win-bg);
      padding: 3px;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    .title-bar {
      background: linear-gradient(90deg, var(--title-blue), #1084d0);
      color: var(--title-text);
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .title-bar-controls button {
      width: 16px;
      height: 14px;
      font-size: 9px;
      font-weight: bold;
      vertical-align: middle;
      background-color: var(--win-bg);
      border: 1px solid;
      border-color: var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
      cursor: pointer;
    }

    .window-body {
      padding: 16px;
    }

    .window-inset {
      padding: 16px;
      background: #fff;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      margin-top: 8px;
      color: var(--win-edge-dark);
      border-bottom: 1px solid var(--win-edge-shadow);
      padding-bottom: 4px;
    }

    p {
      margin-bottom: 12px;
    }

    /* --- System Support Capabilities Grid --- */
    .service-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .matrix-item {
      padding: 10px;
      background: #f5f5f5;
      font-size: 13px;
    }
